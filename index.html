<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Calendar 2083</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="theme-control-panel">
        <label for="theme-select">Select Theme:</label>
        <select id="theme-select">
            <option value="light-academia">Light Academia (Default)</option>
            <option value="warm-autumn">Warm Autumn Glow</option>
            <option value="earthy-forest">Earthy Forest Hues</option>
            <option value="ocean-serenity">Ocean Blue Serenity</option>
            <option value="purple-dream-v1">Purple Dream (Classic)</option>
            <option value="pastel-rainbow">Pastel Rainbow</option>
            <option value="midnight-sky">Midnight Sky</option>
            <option value="sunset-gradient">Sunset Gradient</option>
            <option value="purple-cascade">Purple Cascade</option>
            <option value="vintage-coral">Vintage Coral Scheme</option>
            <option value="summer-delight">Summer Delight</option>
            <option value="monochrome-print">Black & White (Print Friendly)</option>
        </select>
    </div>

    <!-- everything after is done in scripts.js -->
    <div class="calendars-wrapper" id="calendars-wrapper"></div>

    <script src="script.js"></script>
</body>
</html>
